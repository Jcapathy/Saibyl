services:
  # ── Backend API (FastAPI + Uvicorn) ──────────────────────────────
  - type: web
    name: saibyl-backend
    runtime: docker
    # Standard (1 vCPU, 2 GB), raised from `starter` on 2026-08-22 and NOT a
    # preference — the Website Gauntlet does not work below it.
    #
    # A headless Chromium wants 300–500 MB and real CPU to lay a page out. On
    # starter (0.5 vCPU, 512 MB) no commercial website ever captured
    # successfully: stripe.com and simplepractice.com failed or wedged on every
    # attempt for four days. On Standard they capture in 11 and 21 seconds, and
    # two at once leave the rest of the API answering normally.
    #
    # This line is written down because the upgrade was made in the dashboard,
    # and a Blueprint sync from a file still saying `starter` would silently
    # take it back and break the flagship module again. If this ever comes
    # down, `WEBSITE_CAPTURE_CONCURRENCY` must come down with it.
    plan: standard
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # STRIPE_PRICE_ID_STARTER / _PRO / _ENTERPRISE were removed on
      # 2026-08-27. They are leftovers from the subscription tiers deleted on
      # 2026-08-25, and no Python has read them since — there is no such field
      # on `Settings`. They were worse than dead: a top-up builds its price
      # INLINE (`price_data` in `create_topup_checkout`), because a top-up is
      # any amount from $10 to $500 rather than a fixed SKU. So a Stripe price
      # id has nowhere to go, and three empty slots named PRICE_ID invite
      # somebody to paste one in and wonder why nothing changes.
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

      # ── USPTO (IP Check) ──────────────────────────────────────────
      # Declared here so the requirement is visible in the repository. Both
      # were missing from this file entirely, which is why IP Check returned
      # 503 in production for days without anything recording that a key was
      # the reason.
      #
      # ODP is REQUIRED: `POST /api/clearance` refuses with 503 before it
      # creates or charges anything when this is empty, so the module is dead
      # without it — correctly, and visibly.
      - key: USPTO_ODP_API_KEY
        sync: false
      # TSDR is optional and degrades honestly: `tracks.py` skips the
      # trademark-status pass when it is absent rather than failing the run.
      # Set it — the detail is worth having — but a missing value costs a
      # section, not the check.
      - key: USPTO_TSDR_API_KEY
        sync: false

      # Gates the admin-only routes (`api/admin.py`): a signed-in member of
      # this organisation gets them, everyone else is refused.
      #
      # A literal rather than `sync: false` on purpose. It is not a secret —
      # it is an organisation id, and holding it grants nothing without
      # credentials for a member of that organisation — so putting it in the
      # dashboard would only mean one more thing to type and one more thing to
      # forget. It was forgotten for days.
      - key: ADMIN_ORGANIZATION_ID
        value: 231b7f17-d17c-4f6e-b530-f0196acd841b
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-opus-4-7
      - key: LLM_FAST_MODEL
        value: claude-haiku-4-5-20251001
      - key: SUPABASE_STORAGE_BUCKET
        value: saibyl-uploads
      - key: SIMULATION_MAX_ROUNDS
        value: "10"
      - key: SIMULATION_WORKER_CONCURRENCY
        value: "4"
      # The apex domain, not the Render subdomain. This is where Stripe returns
      # a founder after a top-up, so leaving it on `onrender.com` would bounce
      # them off the branded site the moment they had paid.
      - key: FRONTEND_URL
        value: https://saibyl.com
      - key: BACKEND_URL
        value: https://saibyl-backend.onrender.com
      # **All three, and the Render subdomain stays.** The browser sends the
      # origin it was served from, so the moment the site answers on
      # `saibyl.com` every API call carries that origin and a backend allowing
      # only `onrender.com` refuses all of them. The page would load perfectly
      # and do nothing: no login, no runs, no billing.
      #
      # The `onrender.com` entry is kept rather than replaced because that
      # address stays live and is what a rollback or a direct check would use.
      # `www` is listed because Render serves it as its own hostname.
      - key: CORS_ORIGINS
        value: https://saibyl.com,https://www.saibyl.com,https://saibyl-frontend.onrender.com
      - key: REDIS_URL
        fromService:
          name: saibyl-redis
          type: redis
          property: connectionString

  # ── Follow-ups (the loop that answers the credibility critical) ──
  #
  # Asks founders, two and four weeks after a run, what buyers actually pushed
  # back on. Their answers are the only thing that can ever support a public
  # claim that synthetic objections predict real ones — see
  # `services/engine/outcomes.py` and migration 044.
  #
  # **Daily, not fortnightly.** The due check is a window, so a day lost to a
  # deploy or an outage is caught the next morning. Fortnightly would skip that
  # founder permanently, and nobody would notice.
  #
  # Re-running is safe: `followup_sends` is unique on (simulation_id, stage) and
  # the row is claimed before the send.
  #
  # **The same Docker image as the API, deliberately.** The native Python
  # runtime with `uv sync` would build a second, subtly different environment —
  # and a mail job that works locally and fails only in production, at 15:00,
  # unattended, is the worst place to discover a dependency skew. The Dockerfile
  # already copies `scripts/` and puts `.venv/bin` on PATH, so nothing about the
  # image changes to support this.
  - type: cron
    name: saibyl-followups
    runtime: docker
    plan: starter
    schedule: "0 15 * * *"          # 15:00 UTC — mid-morning US, late afternoon EU
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m scripts.send_followups
    envVars:
      # The same four the API uses to reach Supabase, plus mail. A cron service
      # does NOT inherit the web service's environment — every one of these has
      # to be set on this service too, and a missing one is a job that runs
      # green and sends nothing.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # The From: address. Must be on a domain verified in Resend — until it is,
      # Resend will only accept `onboarding@resend.dev`, and only to the account
      # owner's own address.
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      # The follow-up links back to the founder's report, so this must be the
      # apex domain and not the Render subdomain.
      - key: FRONTEND_URL
        value: https://saibyl.com

  # ── Frontend (React SPA on Render Static) ───────────────────────
  - type: web
    name: saibyl-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      # The prerendered public pages, before the catch-all.
      #
      # `npm run build` writes `dist/privacy/index.html` and
      # `dist/terms/index.html` with the real markup in them, so an answer
      # engine that does not run JavaScript has something to read. Routes are
      # evaluated in order, and the `/*` rewrite below would otherwise hand
      # every one of those requests the empty SPA shell instead, which is the
      # state that made every word on this site invisible to ChatGPT, Claude
      # and Perplexity in the first place.
      #
      # Whether Render would have served the matching file anyway is not
      # something to rely on. Stated explicitly, this is correct either way.
      #
      # **Keep in step with `PRERENDERED_ROUTES` in
      # `frontend/src/entry-server.tsx`.** A route prerendered but not listed
      # here is a file that is never served; a route listed here but not
      # prerendered is a 404. `frontend/src/test/prerender.test.ts` fails on
      # either.
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://api.fontshare.com https://fonts.googleapis.com; font-src 'self' https://cdn.fontshare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://saibyl-backend.onrender.com wss://saibyl-backend.onrender.com https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
    envVars:
      - key: VITE_API_URL
        value: https://saibyl-backend.onrender.com/api
      - key: VITE_WS_URL
        value: wss://saibyl-backend.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # ── Redis (pub/sub for real-time WebSocket updates) ─────────────
  - type: redis
    name: saibyl-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
