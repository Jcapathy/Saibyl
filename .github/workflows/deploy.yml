name: Deploy to Render

on:
  push:
    branches: [master]

jobs:
  # A deploy that ships whatever is on master regardless of the suite is a
  # check that can pass for the wrong reason. `needs: test` makes red block
  # the deploy; the gates below mirror the canonical verification in
  # HANDOFF.md — `npm run build`, never bare `tsc --noEmit`, plus vitest so
  # the frontend acceptance scans (jargon, reachability) gate the deploy too.
  test:
    runs-on: ubuntu-latest
    # Production runs with Redis and the export API reaches it, so the gate
    # runs with one too. Without it the suite is red on an environment gap
    # rather than on the code, and a permanently red gate blocks every deploy
    # while telling nobody anything.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
      - name: Backend tests
        run: cd backend && uv sync --extra dev && uv run ruff check . && uv run pytest --tb=short
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend checks
        run: cd frontend && npm ci && npm run build && npx eslint . --quiet && npx vitest run

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy Backend
        run: curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"
      - name: Deploy Frontend
        run: curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
