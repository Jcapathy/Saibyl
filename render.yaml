services:
  # ── Backend API (FastAPI + Uvicorn) ──────────────────────────────
  - type: web
    name: saibyl-backend
    runtime: docker
    # Standard (1 vCPU, 2 GB), raised from `starter` on 2026-08-22 and NOT a
    # preference — the Website Gauntlet does not work below it.
    #
    # A headless Chromium wants 300–500 MB and real CPU to lay a page out. On
    # starter (0.5 vCPU, 512 MB) no commercial website ever captured
    # successfully: stripe.com and simplepractice.com failed or wedged on every
    # attempt for four days. On Standard they capture in 11 and 21 seconds, and
    # two at once leave the rest of the API answering normally.
    #
    # This line is written down because the upgrade was made in the dashboard,
    # and a Blueprint sync from a file still saying `starter` would silently
    # take it back and break the flagship module again. If this ever comes
    # down, `WEBSITE_CAPTURE_CONCURRENCY` must come down with it.
    plan: standard
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_STARTER
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_ENTERPRISE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-opus-4-7
      - key: LLM_FAST_MODEL
        value: claude-haiku-4-5-20251001
      - key: SUPABASE_STORAGE_BUCKET
        value: saibyl-uploads
      - key: SIMULATION_MAX_ROUNDS
        value: "10"
      - key: SIMULATION_WORKER_CONCURRENCY
        value: "4"
      - key: FRONTEND_URL
        value: https://saibyl-frontend.onrender.com
      - key: BACKEND_URL
        value: https://saibyl-backend.onrender.com
      - key: CORS_ORIGINS
        value: https://saibyl-frontend.onrender.com
      - key: REDIS_URL
        fromService:
          name: saibyl-redis
          type: redis
          property: connectionString

  # ── Frontend (React SPA on Render Static) ───────────────────────
  - type: web
    name: saibyl-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://api.fontshare.com https://fonts.googleapis.com; font-src 'self' https://cdn.fontshare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://saibyl-backend.onrender.com wss://saibyl-backend.onrender.com https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
    envVars:
      - key: VITE_API_URL
        value: https://saibyl-backend.onrender.com/api
      - key: VITE_WS_URL
        value: wss://saibyl-backend.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # ── Redis (pub/sub for real-time WebSocket updates) ─────────────
  - type: redis
    name: saibyl-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
