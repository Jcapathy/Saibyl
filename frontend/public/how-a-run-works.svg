<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 260" width="1120" height="260" role="img" aria-labelledby="hrw-title hrw-desc">
  <title id="hrw-title">How a Saibyl run works</title>
  <desc id="hrw-desc">Your material becomes an audience, the audience argues over several rounds, and the run returns objections ranked by how much of the room carried each one, with the sentences behind every number.</desc>

  <defs>
    <linearGradient id="hrw-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#286cf0"/><stop offset="1" stop-color="#5268e9"/>
    </linearGradient>
    <linearGradient id="hrw-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf5ff"/><stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="260" rx="28" fill="url(#hrw-ground)"/>

  <!-- 1. material -->
  <g>
    <rect x="34" y="62" width="196" height="136" rx="18" fill="#ffffff" stroke="#286cf0" stroke-opacity=".18"/>
    <text x="56" y="96" font-family="DM Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="1.4" fill="#286cf0">01</text>
    <text x="56" y="126" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700" fill="#14294a">Your material</text>
    <text x="56" y="150" font-family="Manrope, system-ui, sans-serif" font-size="12.5" fill="#60718e">A deck, your site, or</text>
    <text x="56" y="168" font-family="Manrope, system-ui, sans-serif" font-size="12.5" fill="#60718e">five short answers.</text>
  </g>
  <path d="M244 130 L282 130" stroke="#286cf0" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>
  <path d="M274 124 L282 130 L274 136" fill="none" stroke="#286cf0" stroke-opacity=".4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. the room -->
  <g>
    <rect x="296" y="42" width="264" height="176" rx="20" fill="#ffffff" stroke="#286cf0" stroke-opacity=".22"/>
    <text x="320" y="76" font-family="DM Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="1.4" fill="#286cf0">02</text>
    <text x="320" y="106" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700" fill="#14294a">The room</text>
    <text x="320" y="130" font-family="Manrope, system-ui, sans-serif" font-size="12.5" fill="#60718e">Buyers built from what you</text>
    <text x="320" y="148" font-family="Manrope, system-ui, sans-serif" font-size="12.5" fill="#60718e">gave it. Some are built to</text>
    <text x="320" y="166" font-family="Manrope, system-ui, sans-serif" font-size="12.5" fill="#60718e">argue against you.</text>
    <circle cx="330" cy="192" r="9" fill="#286cf0" fill-opacity=".16"/>
    <circle cx="352" cy="192" r="9" fill="#286cf0" fill-opacity=".16"/>
    <circle cx="374" cy="192" r="9" fill="#8b73ee" fill-opacity=".22"/>
    <circle cx="396" cy="192" r="9" fill="#286cf0" fill-opacity=".16"/>
    <circle cx="418" cy="192" r="9" fill="#8b73ee" fill-opacity=".22"/>
    <circle cx="440" cy="192" r="9" fill="#286cf0" fill-opacity=".16"/>
    <text x="460" y="196" font-family="DM Mono, ui-monospace, monospace" font-size="10.5" fill="#8b73ee">2 argue back</text>
  </g>
  <path d="M574 130 L612 130" stroke="#286cf0" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>
  <path d="M604 124 L612 130 L604 136" fill="none" stroke="#286cf0" stroke-opacity=".4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. rounds -->
  <g>
    <rect x="626" y="62" width="180" height="136" rx="18" fill="#ffffff" stroke="#286cf0" stroke-opacity=".18"/>
    <text x="648" y="96" font-family="DM Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="1.4" fill="#286cf0">03</text>
    <text x="648" y="126" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700" fill="#14294a">They argue</text>
    <text x="648" y="150" font-family="Manrope, system-ui, sans-serif" font-size="12.5" fill="#60718e">Several rounds, with</text>
    <text x="648" y="168" font-family="Manrope, system-ui, sans-serif" font-size="12.5" fill="#60718e">each other, not just you.</text>
  </g>
  <path d="M820 130 L858 130" stroke="#286cf0" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>
  <path d="M850 124 L858 130 L850 136" fill="none" stroke="#286cf0" stroke-opacity=".4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4. objections -->
  <g>
    <rect x="872" y="42" width="214" height="176" rx="20" fill="url(#hrw-blue)"/>
    <text x="896" y="76" font-family="DM Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="1.4" fill="#ffffff" fill-opacity=".8">04</text>
    <text x="896" y="106" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">What stopped them</text>
    <text x="896" y="130" font-family="Manrope, system-ui, sans-serif" font-size="12.5" fill="#ffffff" fill-opacity=".86">Objections ranked by how</text>
    <text x="896" y="148" font-family="Manrope, system-ui, sans-serif" font-size="12.5" fill="#ffffff" fill-opacity=".86">many of the room carried</text>
    <text x="896" y="166" font-family="Manrope, system-ui, sans-serif" font-size="12.5" fill="#ffffff" fill-opacity=".86">each one.</text>
    <rect x="896" y="182" width="166" height="1" fill="#ffffff" fill-opacity=".28"/>
    <text x="896" y="202" font-family="DM Mono, ui-monospace, monospace" font-size="10.5" fill="#ffffff" fill-opacity=".9">EVERY NUMBER OPENS</text>
    <text x="896" y="216" font-family="DM Mono, ui-monospace, monospace" font-size="10.5" fill="#ffffff" fill-opacity=".9">INTO ITS SENTENCES</text>
  </g>
</svg>
