<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saibyl — Find out what buyers will object to, before you launch</title>

    <!-- SEO — must tell the same story as the page body (gauntlet critique
         2026-08-16: the old V1 metadata sold a different product, and said
         8 platforms where the page says 12 places). -->
    <meta name="description" content="Upload your deck — or answer five short questions — and Saibyl builds a room of AI buyers from your own material, pitches them, and shows you every objection with the exact sentences behind it. One full free run. No card, ever." />
    <meta name="keywords" content="startup idea validation, buyer objections, message testing, AI focus group, launch rehearsal, founder tools" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://saibyl.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://saibyl.com/" />
    <meta property="og:title" content="Saibyl — Find out what buyers will object to, before you launch" />
    <meta property="og:description" content="A room of AI buyers built from your own material reads your pitch and shows you every objection — with the exact sentences behind it. A rehearsal, not a survey. One full free run, no card." />
    <meta property="og:image" content="https://saibyl.com/og-image.png" />
    <meta property="og:site_name" content="Saibyl" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@saidolabs" />
    <meta name="twitter:title" content="Saibyl — Find out what buyers will object to, before you launch" />
    <meta name="twitter:description" content="A room of AI buyers built from your own material reads your pitch and shows you every objection — with the exact sentences behind it. One full free run, no card." />
    <meta name="twitter:image" content="https://saibyl.com/og-image.png" />

    <!-- Structured data.

         This is in index.html rather than injected by React on purpose: the
         app is a client-rendered SPA, and an answer engine that does not
         execute JavaScript sees only what is in this file. Everything below
         is therefore true of the product without a single script running.

         Claims here are limited to what the product actually does and what
         the pricing code actually charges. A schema block is machine-readable
         marketing copy, and an inflated one is the fastest way to be cited
         inaccurately by the engines this exists to reach. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://saibyl.com/#organization",
          "name": "Saido Labs LLC",
          "url": "https://saibyl.com/",
          "email": "info@saidolabs.com"
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://saibyl.com/#app",
          "name": "Saibyl",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "publisher": { "@id": "https://saibyl.com/#organization" },
          "description": "Saibyl builds a room of AI buyers from a founder's own material, puts the pitch in front of them, and reports every objection with the exact sentences behind it — before launch.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "description": "One full evaluation of your idea is free. No card required."
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://saibyl.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How do I find out if my startup idea is already taken?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Saibyl runs a USPTO search across registered trademarks, granted patents and pending applications, and reports what stands closest to your idea with the filing attached. The free evaluation covers whether buyers want it; the clearance check covers whether it is yours to build."
              }
            },
            {
              "@type": "Question",
              "name": "How can I validate a startup idea without any customers yet?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Answer five questions about the problem, who has it, and what people use today. Saibyl builds a room of AI buyers from those answers, has them react to the pitch, and returns the objections ranked by how much of the room carried each one — with the sentences they said. It takes about three minutes and the first evaluation is free."
              }
            },
            {
              "@type": "Question",
              "name": "What will buyers object to about my product?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Saibyl measures objections rather than guessing them. Each one is ranked by reach, intensity and how widely it spreads across different kinds of buyer, so the objection that actually costs deals ranks above the one that is merely loudest, and every number traces back to a quote."
              }
            },
            {
              "@type": "Question",
              "name": "Is Saibyl a survey or a focus group?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Neither. It is a rehearsal. The buyers are synthetic and labelled as synthetic on every screen. What it measures is how a pitch lands and what it fails to answer, before that costs real money to find out."
              }
            }
          ]
        }
      ]
    }
    </script>

    <!-- Manrope + Playfair Display + DM Mono (Google Fonts) — the landing redesign's type system -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400..800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
