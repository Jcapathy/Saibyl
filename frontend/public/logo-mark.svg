<?xml version="1.0" encoding="UTF-8"?>
<!--
  SAIBYL — the brand mark.

  **This is a transcription of `.v3land .brand-mark` in
  `frontend/src/pages/landing.css` (lines 83-84), not a drawing of it.**
  That rule is the mark the site actually renders in its header, and every
  number below is its value scaled by 72/29 = 2.48276:

      border-radius: 12px                -> rx 29.79
      font: 700 17px "Playfair Display"  -> font-size 42.21
      ::after 12px dot, top -5 right -4  -> r 14.90 at (67.03, 2.48)
      inset 0 1px rgba(255,255,255,.4)   -> the 2.48-wide top highlight
      overflow: hidden                   -> the clipPath, which is what turns
                                            the dot into the crescent you see

  What this replaced was a node-graph on a dark circle in #5B5FEE / #00D4FF —
  the V2 mark, which appears nowhere on the product and had been the browser-tab
  icon and the printed report's logo ever since the light system shipped.

  `logo-mark.svg` is a copy of this file. It is what `ReportPrintPage` puts at
  the top of a report a founder hands to somebody, so the two must not diverge.

  If `landing.css` changes, this file is stale: it is the same values written
  twice, and no test covers an asset in `public/`.
-->
<svg width="72" height="72" viewBox="0 0 72 72" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Saibyl</title>
  <defs>
    <!-- CSS `135deg` runs top-left to bottom-right; in userSpaceOnUse that is
         (0,0) to (72,72). Stops at 5% and 95%, as the rule has them. -->
    <linearGradient id="sb" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0.05" stop-color="#2f75ef"/>
      <stop offset="0.95" stop-color="#705ee3"/>
    </linearGradient>
    <clipPath id="sq">
      <rect width="72" height="72" rx="29.79"/>
    </clipPath>
    <!-- `inset 0 1px` lights the top edge and fades as the corner turns away
         from it. A straight line across the top reads as a band instead of a
         rim, so the rim is a stroke ON the rounded rect (which follows the
         curve), faded out by this gradient before it reaches the sides. -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="72" height="72" fill="url(#sb)"/>
    <!-- inset 0 1px rgba(255,255,255,.4): stroked at 2x and clipped, so only
         the inner half survives — the SVG equivalent of an inset shadow. -->
    <rect width="72" height="72" rx="29.79" fill="none"
          stroke="url(#rim)" stroke-width="4.96"/>
    <!-- The ::after dot, clipped by the square into a crescent. -->
    <circle cx="67.03" cy="2.48" r="14.9" fill="#ffffff" fill-opacity="0.7"/>
  </g>

  <!-- Georgia is named after Playfair because a favicon cannot load a web font;
       at tab size the two are indistinguishable, and the gradient and the
       crescent are what make the mark recognisable. -->
  <text x="36" y="50.5" text-anchor="middle"
        font-family="Playfair Display, Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="42.21" fill="#ffffff">S</text>
</svg>
